# Build both firmwares (HDLCGW for slot 1, XMSGGW for slot 2) on every push and pull request,
# and keep the files as a build artifact. A tag v* also makes the GitHub release with the files
# docs/INSTALL.md describes, then starts the docs workflow on master so the browser flash page
# (src/docs-site/flash/) gets the new files.
#
# Same tools as the bench build: arduino-cli 1.5.1, Arduino ESP32 core 3.3.12, board
# lolin_s2_mini, libxmsg from the submodule at its pinned commit.
name: Firmware

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # the release
  actions: write    # starting the docs workflow after a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install the ESP32 core 3.3.12
        env:
          URL: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        run: |
          arduino-cli core update-index --additional-urls "$URL"
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls "$URL"

      - name: Build HDLCGW and XMSGGW
        run: |
          for fw in HDLCGW XMSGGW; do
            arduino-cli compile --fqbn esp32:esp32:lolin_s2_mini --warnings all \
              --library src/external/libxmsg --build-path "build/$fw" "src/$fw"
          done

      - name: Collect the files (names as in docs/INSTALL.md)
        run: |
          mkdir -p out
          cp build/HDLCGW/HDLCGW.ino.bin            out/HDLCGW.bin
          cp build/XMSGGW/XMSGGW.ino.bin            out/XMSGGW.bin
          cp build/HDLCGW/HDLCGW.ino.bootloader.bin out/bootloader.bin
          cp build/HDLCGW/HDLCGW.ino.partitions.bin out/partitions.bin
          cp build/HDLCGW/boot_app0.bin             out/boot_app0.bin
          ESPTOOL=$(ls -d ~/.arduino15/packages/esp32/tools/esptool_py/*/ | tail -n 1)esptool
          "$ESPTOOL" --chip esp32s2 merge-bin -o out/full.bin \
            --flash-mode dio --flash-freq 80m --flash-size 4MB \
            0x1000 out/bootloader.bin 0x8000 out/partitions.bin 0xe000 out/boot_app0.bin \
            0x10000 out/HDLCGW.bin 0x150000 out/XMSGGW.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/*.bin --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "HDLCGW and XMSGGW for the HDLC-ESP32-S2 board. How to install: docs/INSTALL.md, or the browser flash page https://retrocorelabs.github.io/HDLCGW/flash/"
          gh workflow run docs.yml --ref master --repo "$GITHUB_REPOSITORY"
