# Build the documentation site and publish it to GitHub Pages
# (https://retrocorelabs.github.io/HDLCGW/) on every push to master.
# A pull request builds and checks it without publishing.
# The pages come from the headers and the Markdown files: src/tools/gen_docs.py writes them,
# src/docs-site/ holds the settings. The flash page (src/docs-site/flash/) gets the newest
# release's .bin files: GitHub's release downloads cannot be read by a web page from another
# site, so the browser installer needs them on this site. A release does not start this
# workflow: the github-pages environment only takes deploys from master, and a release run
# is on its tag. After a release, run this workflow by hand on master (Actions, Docs, Run
# workflow), or let the next push to master do it.
name: Docs

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install -r src/docs-site/requirements.txt
      - name: Check the contents lists are up to date
        run: python3 src/tools/gen_toc.py --check
      - name: Write the pages
        run: python3 src/tools/gen_docs.py build-site
      - name: Put the newest release's firmware files next to the flash page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.bin' --dir build-site/docs/flash
            ls -l build-site/docs/flash
          else
            echo "No release yet: the flash page has no files to write."
          fi
      - name: Build site
        run: mkdocs build --strict -f build-site/mkdocs.yml -d "${{ runner.temp }}/site"
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
